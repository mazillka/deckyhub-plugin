name: Feature request
description: Suggest an idea or improvement for DeckyHub.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Want a plugin added to DeckyHub's list? Suggest it in [mazillka/deckyhub-registry](https://github.com/mazillka/deckyhub-registry/issues/new) instead.
  - type: textarea
    id: problem
    attributes:
      label: What would you like DeckyHub to do?
      description: The problem it solves or what it would make easier.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Where it would go in DeckyHub and how you'd use it. Mockups or screenshots welcome.
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Workarounds you use today, other apps that do it, or other context.
