version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: npm
    directory: /devtools/decky-mock
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      # react and react-dom must stay on the exact same version.
      react:
        patterns: [react, react-dom]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  # ruff, the dev-only Python formatter and linter (requirements-dev.txt).
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
