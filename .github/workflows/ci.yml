name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the run it replaces; pushes to main and develop
# always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that only touches the website's docs/, promo/ or Markdown skips the browser tests.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then echo "e2e=true" >> "$GITHUB_OUTPUT"; echo "site=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The website is built and audited when its pages, its build scripts or this workflow change.
          site=$(git diff --name-only "$BASE...$HEAD" | grep -E '^(docs/|devtools/[a-z_-]+\.py$|\.github/workflows/ci\.yml$)' || true)
          echo "site=$([[ -n "$site" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          others=$(git diff --name-only "$BASE...$HEAD" | grep -vE '^(docs|promo)/|\.md$' || true)
          echo "e2e=$([[ -n "$others" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Files beyond docs/, promo/ and Markdown: ${others:-none}"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          # Formatting and lint (prettier, ruff). Ruff is a dev tool only; the plugin itself
          # stays standard-library Python.
          python3 -m venv "$RUNNER_TEMP/venv"
          # Two installs: requirements-remote.txt carries hashes, which pip would then demand of ruff too.
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r requirements-remote.txt
          PATH="$RUNNER_TEMP/venv/bin:$PATH" pnpm run lint
          pnpm run typecheck
          pnpm run build
          python3 -c 'from pathlib import Path; files=list(Path("dist").glob("*.js")); size=sum(p.stat().st_size for p in files); print(f"Frontend JS: {size} bytes"); assert files and size < 8 * 1024 * 1024, "Frontend JS exceeds 8 MiB budget"'
          pnpm run test:frontend
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  # The website: builds it, then checks every page for what search engines and AI assistants need (a unique title and
  # description, one canonical, structured data that parses, language alternates that link back, a sitemap that lists
  # every page once, a short llms.txt) and for broken links. The same audit pages.yml only logs; here it must pass.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pip install pillow==13.0.0 markdown==3.7
      - run: python devtools/build-site.py _site
        env:
          # The release notes page reads DeckyHub's releases from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      - run: python devtools/audit-site.py _site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Accessibility audit
        run: |
          cd devtools/decky-mock
          npm ci
          npm install --no-save --package-lock=false axe-core@4.10.3
          npx playwright install --with-deps chromium
          cd ../..
          python -m http.server 8765 --directory _site >/tmp/deckyhub-site.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..30}; do curl --silent --fail http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node devtools/decky-mock/accessibility.mjs

  # The check the main and develop rulesets require. It passes when the unit tests passed
  # and the browser tests and the website checks passed or were skipped for a change that doesn't touch them.
  test:
    needs: [changes, unit, e2e, site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=$CHANGES unit=$UNIT e2e=$E2E site=$SITE"
          [[ "$CHANGES" == success && "$UNIT" == success && ( "$E2E" == success || "$E2E" == skipped ) && ( "$SITE" == success || "$SITE" == skipped ) ]]
        env:
          CHANGES: ${{ needs.changes.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          SITE: ${{ needs.site.result }}
