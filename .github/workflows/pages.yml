name: Deploy Website

on:
  push:
    branches: [main]
    paths: [docs/**, screenshots/**, promo/deckyhub.gif, devtools/build-site.py, devtools/plugin_pages.py, .github/workflows/pages.yml]
  # The catalog comes from mazillka/deckyhub-registry, so rebuild daily to pick up its changes.
  schedule:
    - cron: "0 6 * * *"
  # Also started by release.yml from main after each release, for the release notes page.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: the site (main) and its develop preview go out together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The live site is built from main, and a preview of develop goes under /develop/ in the
      # same deployment (GitHub Pages serves one site per repository). preview-site.yml starts
      # this workflow from main after each push to develop, which is why it runs from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: develop
          path: develop
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pip install pillow==13.0.0 markdown==3.7
      - run: python main/devtools/build-site.py _site
        env:
          # The release notes page reads DeckyHub's releases from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      # Not blocking: it lists page problems (titles, descriptions, links) in the log.
      - name: Audit the site
        continue-on-error: true
        run: python main/devtools/audit-site.py _site
      # The preview must never stop the live site: it's built on the side and only moved in
      # when it worked (a develop without --preview support yet fails here and is skipped).
      - name: Build the develop preview
        continue-on-error: true
        run: |
          python develop/devtools/build-site.py _preview --preview /develop/
          mv _preview _site/develop
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
