name: Registry compatibility
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  registry:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        registry-ref: [main, develop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazillka/deckyhub-registry
          ref: ${{ matrix.registry-ref }}
          path: registry-checkout
      - run: python3 -m unittest tests.test_registry_schema
        env:
          DECKYHUB_REGISTRY: ${{ github.workspace }}/registry-checkout/registry/apps.json
