name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Installs and runs third-party packages, so it gets a read-only token; only
  # the publish job below can write the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [[ "$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2; exit 1; }
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          pnpm run test:frontend
          python3 -m unittest discover -s tests
      - name: Run browser E2E tests
        run: |
          npm ci --prefix devtools/decky-mock
          cd devtools/decky-mock
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package Decky plugin
        run: |
          # Decky loads only dist/index.js; the source map would be ~85% of the ZIP.
          mkdir -p release/DeckyHub/dist
          cp dist/index.js release/DeckyHub/dist/
          cp LICENSE.md main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Verify release package
        run: |
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/main.py"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/plugin.json"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/dist/index.js"
          if unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -F ".map"; then echo "source map in the ZIP"; exit 1; fi
          sha256sum "DeckyHub-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: DeckyHub-${{ github.ref_name }}.zip
          if-no-files-found: error

  # Scans the packaged ZIP with ClamAV and that day's signatures. Anything found (or a
  # scan that can't run) stops the release; the report is attached to it. The code itself
  # is checked by CodeQL (codeql.yml) on every push and PR.
  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Install ClamAV and today's signatures
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clamav
          # The package starts its own updater; stop it so ours doesn't wait on its lock.
          sudo systemctl stop clamav-freshclam || true
          for wait in 0 30 120; do
            sleep "$wait"
            sudo freshclam --stdout && exit 0
          done
          exit 1
      - name: Scan the release ZIP
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          # Not named DeckyHub-*: the self-update and the registry's asset filter look for that.
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          status=0
          clamscan --stdout --max-filesize=1024M --max-scansize=4095M --alert-exceeds-max=yes "$zip" > scan.log || status=$?
          {
            echo "ClamAV scan of $zip"
            echo "SHA-256: $(sha256sum "$zip" | cut -d' ' -f1)"
            echo "Scanner: $(clamscan --version)"
            echo "Scanned: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat scan.log
          } > "$report"
          cat "$report"
          [[ "$status" == 0 ]] || { echo "::error::ClamAV flagged $zip or couldn't scan it (exit $status)"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clamav-report
          path: ClamAV-scan-${{ github.ref_name }}.txt
          if-no-files-found: error

  publish:
    needs: [build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clamav-report
      - name: Create GitHub Release
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          # Kept as the last section when the notes are rewritten (AGENTS.md's Release section).
          notes="## Security checks"$'\n\n'"- **Virus scan:** ClamAV found no threats in \`DeckyHub-${GITHUB_REF_NAME}.zip\` ([scan report](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${report}))."$'\n'"- **Code analysis:** GitHub [CodeQL](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml) checks the Python and TypeScript code on every change."
          gh release create "$GITHUB_REF_NAME" "DeckyHub-${GITHUB_REF_NAME}.zip" "$report" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$notes" "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
