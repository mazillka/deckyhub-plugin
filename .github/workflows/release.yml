name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          python3 -m unittest discover -s tests
      - name: Package Decky plugin
        run: |
          mkdir -p release/DeckyHub
          cp -r backend dist registry release/DeckyHub/
          cp LICENSE main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "DeckyHub-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
