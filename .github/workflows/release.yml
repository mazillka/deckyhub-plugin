name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          python3 -m unittest discover -s tests
      - name: Run browser E2E tests
        run: |
          npm ci --prefix devtools/decky-mock
          cd devtools/decky-mock
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package Decky plugin
        run: |
          mkdir -p release/DeckyHub
          cp -r backend dist registry release/DeckyHub/
          cp LICENSE main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Verify release package
        run: |
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/main.py"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/plugin.json"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/dist/index.js"
          sha256sum "DeckyHub-${GITHUB_REF_NAME}.zip"
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "DeckyHub-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
