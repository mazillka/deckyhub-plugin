name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          python3 -m unittest discover -s tests
      - name: Package Decky plugin
        run: |
          mkdir -p release/DeckyHub
          cp -r backend dist release/DeckyHub/
          cp LICENSE main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" "DeckyHub-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
