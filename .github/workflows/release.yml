name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Installs and runs third-party packages, so it gets a read-only token; only
  # the publish job below can write the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [[ "$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2; exit 1; }
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          pnpm run test:frontend
          python3 -m unittest discover -s tests
      - name: Run browser E2E tests
        run: |
          npm ci --prefix devtools/decky-mock
          cd devtools/decky-mock
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package Decky plugin
        run: |
          mkdir -p release/DeckyHub
          cp -r dist registry release/DeckyHub/
          cp LICENSE.md main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Verify release package
        run: |
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/main.py"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/plugin.json"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/dist/index.js"
          sha256sum "DeckyHub-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: DeckyHub-${{ github.ref_name }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Create GitHub Release
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "DeckyHub-${GITHUB_REF_NAME}.zip" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
