name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Installs and runs third-party packages, so it gets a read-only token; only
  # the publish job below can write the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [[ "$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2; exit 1; }
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          pnpm run test:frontend
          python3 -m unittest discover -s tests
      - name: Run browser E2E tests
        run: |
          npm ci --prefix devtools/decky-mock
          cd devtools/decky-mock
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package Decky plugin
        run: |
          # Decky loads only dist/index.js; the source map would be ~85% of the ZIP.
          mkdir -p release/DeckyHub/dist
          cp dist/index.js release/DeckyHub/dist/
          cp LICENSE.md main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Verify release package
        run: |
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/main.py"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/plugin.json"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/dist/index.js"
          if unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -F ".map"; then echo "source map in the ZIP"; exit 1; fi
          sha256sum "DeckyHub-${GITHUB_REF_NAME}.zip"
      # The same ZIP under a fixed name, for one link that always gets the newest stable
      # release (releases/latest/download/DeckyHub.zip, for Decky's Install Plugin from
      # URL), and the Desktop Mode installer, filled in with this release's tag and the
      # ZIP's SHA-256 so it installs exactly this ZIP. None of the names start "DeckyHub-"
      # (the self-update's pattern) or contain "deckyhub-" (the registry's filter).
      - name: Add the fixed-name ZIP and the Desktop Mode installer
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          cp "$zip" DeckyHub.zip
          sed -e "s/@TAG@/${GITHUB_REF_NAME}/g" -e "s/@SHA256@/${sha}/g" installer/install-deckyhub.sh > install-deckyhub.sh
          sed -e "s/@TAG@/${GITHUB_REF_NAME}/g" installer/Install-DeckyHub.desktop > Install-DeckyHub.desktop
          if grep -n "@TAG@\|@SHA256@" install-deckyhub.sh Install-DeckyHub.desktop; then echo "placeholder left in the installer"; exit 1; fi
          bash -n install-deckyhub.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: |
            DeckyHub-${{ github.ref_name }}.zip
            DeckyHub.zip
            Install-DeckyHub.desktop
            install-deckyhub.sh
          if-no-files-found: error

  # Scans the packaged ZIP with ClamAV and that day's signatures. Never stops the release:
  # the result (clean, flagged or couldn't scan) goes into the report attached to it and
  # into its notes, and people decide whether to install. The code itself is checked by
  # CodeQL (codeql.yml) on every push and PR.
  scan:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan.outputs.result }}
      found: ${{ steps.scan.outputs.found }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Install ClamAV and today's signatures
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clamav
          # The package starts its own updater; stop it so ours doesn't wait on its lock.
          sudo systemctl stop clamav-freshclam || true
          for wait in 0 30 120; do
            sleep "$wait"
            sudo freshclam --stdout && exit 0
          done
          exit 1
      - name: Scan the release ZIP
        id: scan
        env:
          INSTALLED: ${{ steps.install.outcome }}
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          # Not named DeckyHub-*: the self-update and the registry's asset filter look for that.
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          status=0
          if [[ "$INSTALLED" == success ]]; then
            clamscan --stdout --max-filesize=2048M --max-scansize=4095M --alert-exceeds-max=yes "$zip" > scan.log 2>&1 || status=$?
          else
            echo "ClamAV couldn't be installed or couldn't download its virus signatures, so the ZIP wasn't scanned." > scan.log
            status=2
          fi
          case "$status" in
            0) result=clean ;;
            1) result=infected ;;
            *) result=error ;;
          esac
          found=$(grep -oE ': .+ FOUND$' scan.log | sed -E 's/^: (.+) FOUND$/\1/' | sort -u | paste -sd, - || true)
          {
            echo "ClamAV scan of $zip"
            echo "Result: $result${found:+ ($found)}"
            echo "SHA-256: $(sha256sum "$zip" | cut -d' ' -f1)"
            echo "Scanner: $(clamscan --version 2>/dev/null || echo 'not available')"
            echo "Scanned: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat scan.log
          } > "$report"
          cat "$report"
          { echo "result=$result"; echo "found=$found"; } >> "$GITHUB_OUTPUT"
          [[ "$result" == clean ]] || echo "::warning::ClamAV result for $zip: $result${found:+ ($found)}. The release is still published; its notes and report say so."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clamav-report
          path: ClamAV-scan-${{ github.ref_name }}.txt
          if-no-files-found: error

  publish:
    needs: [build, scan]
    # The scan never holds a release back, even if its job broke: the notes say so.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To rebuild the website (pages.yml) for the release notes page.
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: clamav-report
      - name: Create GitHub Release
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          files=("$zip" DeckyHub.zip Install-DeckyHub.desktop install-deckyhub.sh)
          link=""
          if [[ -f "$report" ]]; then
            files+=("$report")
            link=" ([scan report](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${report}))"
          fi
          case "$RESULT" in
            clean) scan="ClamAV found no threats in \`$zip\`$link." ;;
            infected) scan="ClamAV flagged \`$zip\`: ${FOUND}$link. It may be a false positive; read the report before you install." ;;
            error) scan="ClamAV couldn't scan \`$zip\`$link." ;;
            *) scan="The ClamAV scan didn't run for this release." ;;
          esac
          # Kept as the last section when the notes are rewritten (AGENTS.md's Release section).
          notes="## Security checks"$'\n\n'"- **Virus scan:** $scan"$'\n'"- **Code analysis:** GitHub [CodeQL](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml) checks the Python and TypeScript code on every change."
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$notes" "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.scan.outputs.result }}
          FOUND: ${{ needs.scan.outputs.found }}
      # The website's release notes page lists this release on the next build; start it
      # now, from main (the website is always main's). Never fails the release.
      - name: Rebuild the website
        continue-on-error: true
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
