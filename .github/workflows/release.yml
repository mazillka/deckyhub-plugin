name: Release DeckyHub

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Installs and runs third-party packages, so it gets a read-only token; only
  # the publish job below can write the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [[ "$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2; exit 1; }
      - name: Install, test, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          pnpm run test:frontend
          python3 -m unittest discover -s tests
      - name: Run browser E2E tests
        run: |
          npm ci --prefix devtools/decky-mock
          cd devtools/decky-mock
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Package Decky plugin
        run: |
          # Decky loads only dist/index.js; the source map would be ~85% of the ZIP.
          mkdir -p release/DeckyHub/dist
          cp dist/index.js release/DeckyHub/dist/
          cp LICENSE.md main.py package.json plugin.json release/DeckyHub/
          (cd release && zip -r "../DeckyHub-${GITHUB_REF_NAME}.zip" DeckyHub)
      - name: Verify release package
        run: |
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/main.py"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/plugin.json"
          unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -Fx "DeckyHub/dist/index.js"
          if unzip -Z1 "DeckyHub-${GITHUB_REF_NAME}.zip" | grep -F ".map"; then echo "source map in the ZIP"; exit 1; fi
          sha256sum "DeckyHub-${GITHUB_REF_NAME}.zip"
      # The same ZIP under a fixed name, for one link that always gets the newest stable
      # release (releases/latest/download/DeckyHub.zip, for Decky's Install Plugin from
      # URL), and the Desktop Mode installer, filled in with this release's tag and the
      # ZIP's SHA-256 so it installs exactly this ZIP. None of the names start "DeckyHub-"
      # (the self-update's pattern) or contain "deckyhub-" (the registry's filter).
      - name: Add the fixed-name ZIP and the Desktop Mode installer
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          cp "$zip" DeckyHub.zip
          sed -e "s/@TAG@/${GITHUB_REF_NAME}/g" -e "s/@SHA256@/${sha}/g" installer/install-deckyhub.sh > install-deckyhub.sh
          sed -e "s/@TAG@/${GITHUB_REF_NAME}/g" installer/Install-DeckyHub.desktop > Install-DeckyHub.desktop
          if grep -n "@TAG@\|@SHA256@" install-deckyhub.sh Install-DeckyHub.desktop; then echo "placeholder left in the installer"; exit 1; fi
          bash -n install-deckyhub.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: |
            DeckyHub-${{ github.ref_name }}.zip
            DeckyHub.zip
            Install-DeckyHub.desktop
            install-deckyhub.sh
          if-no-files-found: error

  # Scans the packaged ZIP with ClamAV and that day's signatures. Never stops the release:
  # the result (clean, flagged or couldn't scan) goes into the report attached to it and
  # into its notes, and people decide whether to install. The code itself is checked by
  # CodeQL (codeql.yml) on every push and PR.
  scan:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan.outputs.result }}
      found: ${{ steps.scan.outputs.found }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Install ClamAV and today's signatures
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clamav
          # The package starts its own updater; stop it so ours doesn't wait on its lock.
          sudo systemctl stop clamav-freshclam || true
          for wait in 0 30 120; do
            sleep "$wait"
            sudo freshclam --stdout && exit 0
          done
          exit 1
      - name: Scan the release ZIP
        id: scan
        env:
          INSTALLED: ${{ steps.install.outcome }}
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          # Not named DeckyHub-*: the self-update and the registry's asset filter look for that.
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          status=0
          if [[ "$INSTALLED" == success ]]; then
            clamscan --stdout --max-filesize=2048M --max-scansize=4095M --alert-exceeds-max=yes "$zip" > scan.log 2>&1 || status=$?
          else
            echo "ClamAV couldn't be installed or couldn't download its virus signatures, so the ZIP wasn't scanned." > scan.log
            status=2
          fi
          case "$status" in
            0) result=clean ;;
            1) result=infected ;;
            *) result=error ;;
          esac
          found=$(grep -oE ': .+ FOUND$' scan.log | sed -E 's/^: (.+) FOUND$/\1/' | sort -u | paste -sd, - || true)
          {
            echo "ClamAV scan of $zip"
            echo "Result: $result${found:+ ($found)}"
            echo "SHA-256: $(sha256sum "$zip" | cut -d' ' -f1)"
            echo "Scanner: $(clamscan --version 2>/dev/null || echo 'not available')"
            echo "Scanned: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat scan.log
          } > "$report"
          cat "$report"
          { echo "result=$result"; echo "found=$found"; } >> "$GITHUB_OUTPUT"
          [[ "$result" == clean ]] || echo "::warning::ClamAV result for $zip: $result${found:+ ($found)}. The release is still published; its notes and report say so."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clamav-report
          path: ClamAV-scan-${{ github.ref_name }}.txt
          if-no-files-found: error

  # Uploads DeckyHub's own release ZIP to VirusTotal (70+ antivirus engines) and waits for
  # the verdict. Only DeckyHub's ZIP: listed plugins are only looked up by SHA-256 in the
  # app, never uploaded. Like the ClamAV scan it never stops the release, and it's skipped
  # when the VIRUSTOTAL_API_KEY secret isn't set. Free-tier uploads are public on
  # VirusTotal, which is fine: the same ZIP is published on GitHub minutes later.
  virustotal:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.vt.outputs.result }}
      detections: ${{ steps.vt.outputs.detections }}
      url: ${{ steps.vt.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Scan the release ZIP on VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          url="https://www.virustotal.com/gui/file/${sha}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [[ -z "$VT_API_KEY" ]]; then
            echo "::notice::VIRUSTOTAL_API_KEY isn't set, so the ZIP wasn't uploaded to VirusTotal."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=error
          detections=""
          # The free API allows 4 requests a minute, so poll every 30 s, for up to 15 minutes.
          if analysis=$(curl -sSf --retry 3 -H "x-apikey: $VT_API_KEY" -F "file=@$zip" https://www.virustotal.com/api/v3/files | jq -er '.data.id'); then
            result=pending
            for _ in $(seq 30); do
              sleep 30
              body=$(curl -sSf --retry 3 -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/${analysis}") || continue
              [[ "$(jq -r '.data.attributes.status' <<< "$body")" == completed ]] || continue
              malicious=$(jq '.data.attributes.stats.malicious' <<< "$body")
              suspicious=$(jq '.data.attributes.stats.suspicious' <<< "$body")
              # Engines that gave a verdict; unsupported/timed-out/failed ones don't count.
              total=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<< "$body")
              detections="$((malicious + suspicious))/$total"
              if (( malicious + suspicious == 0 )); then result=clean; else result=flagged; fi
              jq '.data.attributes.stats' <<< "$body"
              jq -r '.data.attributes.results[] | select(.category == "malicious" or .category == "suspicious") | "\(.engine_name): \(.result)"' <<< "$body"
              break
            done
          else
            echo "::warning::Couldn't upload the ZIP to VirusTotal (bad API key, quota used up or service down)."
          fi
          echo "VirusTotal: $result${detections:+ ($detections engines flagged it)} $url"
          { echo "result=$result"; echo "detections=$detections"; } >> "$GITHUB_OUTPUT"
          echo "**VirusTotal:** $result${detections:+ ($detections)} — [report]($url)" >> "$GITHUB_STEP_SUMMARY"
          [[ "$result" == clean ]] || echo "::warning::VirusTotal result for $zip: $result${detections:+ ($detections)}. The release is still published; its notes say so."

  # Same idea with OPSWAT MetaDefender Cloud (20+ engines), again only for DeckyHub's own
  # ZIP: never stops the release, skipped when the METADEFENDER_API_KEY secret isn't set.
  metadefender:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.md.outputs.result }}
      detections: ${{ steps.md.outputs.detections }}
      url: ${{ steps.md.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Scan the release ZIP on MetaDefender
        id: md
        env:
          MD_API_KEY: ${{ secrets.METADEFENDER_API_KEY }}
        run: |
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          if [[ -z "$MD_API_KEY" ]]; then
            echo "::notice::METADEFENDER_API_KEY isn't set, so the ZIP wasn't uploaded to MetaDefender."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=error
          detections=""
          url=""
          if data_id=$(curl -sSf --retry 3 -X POST -H "apikey: $MD_API_KEY" -H "filename: $zip" -H "Content-Type: application/octet-stream" --data-binary "@$zip" https://api.metadefender.com/v4/file | jq -er '.data_id'); then
            url="https://metadefender.opswat.com/results/file/${data_id}/regular/overview"
            result=pending
            # Poll every 20 s, for up to 15 minutes.
            for _ in $(seq 45); do
              sleep 20
              body=$(curl -sSf --retry 3 -H "apikey: $MD_API_KEY" "https://api.metadefender.com/v4/file/${data_id}") || continue
              [[ "$(jq -r '.scan_results.progress_percentage // 0' <<< "$body")" == 100 ]] || continue
              detected=$(jq '.scan_results.total_detected_avs // 0' <<< "$body")
              total=$(jq '.scan_results.total_avs // 0' <<< "$body")
              detections="$detected/$total"
              if (( detected == 0 )); then result=clean; else result=flagged; fi
              jq -r '"Verdict: \(.scan_results.scan_all_result_a)"' <<< "$body"
              jq -r '.scan_results.scan_details | to_entries[] | select((.value.threat_found // "") != "") | "\(.key): \(.value.threat_found)"' <<< "$body"
              break
            done
          else
            echo "::warning::Couldn't upload the ZIP to MetaDefender (bad API key, quota used up or service down)."
          fi
          echo "MetaDefender: $result${detections:+ ($detections engines flagged it)} $url"
          { echo "result=$result"; echo "detections=$detections"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "**MetaDefender:** $result${detections:+ ($detections)}${url:+ — [report]($url)}" >> "$GITHUB_STEP_SUMMARY"
          [[ "$result" == clean ]] || echo "::warning::MetaDefender result for $zip: $result${detections:+ ($detections)}. The release is still published; its notes say so."

  publish:
    needs: [build, scan, virustotal, metadefender]
    # The scan never holds a release back, even if its job broke: the notes say so.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: clamav-report
      - name: Create GitHub Release
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          zip="DeckyHub-${GITHUB_REF_NAME}.zip"
          report="ClamAV-scan-${GITHUB_REF_NAME}.txt"
          files=("$zip" DeckyHub.zip Install-DeckyHub.desktop install-deckyhub.sh)
          link=""
          if [[ -f "$report" ]]; then
            files+=("$report")
            link=" ([scan report](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${report}))"
          fi
          case "$RESULT" in
            clean) scan="ClamAV found no threats in \`$zip\`$link." ;;
            infected) scan="ClamAV flagged \`$zip\`: ${FOUND}$link. It may be a false positive; read the report before you install." ;;
            error) scan="ClamAV couldn't scan \`$zip\`$link." ;;
            *) scan="The ClamAV scan didn't run for this release." ;;
          esac
          case "$VT_RESULT" in
            clean) vt="No engine flagged \`$zip\` (${VT_DETECTIONS}) — [VirusTotal report]($VT_URL)." ;;
            flagged) vt="${VT_DETECTIONS} engines flagged \`$zip\` — [VirusTotal report]($VT_URL). Single detections are often false positives; read the report before you install." ;;
            pending) vt="VirusTotal hadn't finished when this release was published — [see its report]($VT_URL)." ;;
            *) vt="" ;;
          esac
          vt_line=""
          [[ -n "$vt" ]] && vt_line="- **VirusTotal:** $vt"$'\n'
          case "$MD_RESULT" in
            clean) md="No engine flagged \`$zip\` (${MD_DETECTIONS}) — [MetaDefender report]($MD_URL)." ;;
            flagged) md="${MD_DETECTIONS} engines flagged \`$zip\` — [MetaDefender report]($MD_URL). Single detections are often false positives; read the report before you install." ;;
            pending) md="MetaDefender hadn't finished when this release was published — [see its report]($MD_URL)." ;;
            *) md="" ;;
          esac
          md_line=""
          [[ -n "$md" ]] && md_line="- **MetaDefender:** $md"$'\n'
          # Kept as the last section when the notes are rewritten (AGENTS.md's Release section).
          notes="## Security checks"$'\n\n'"- **Virus scan:** $scan"$'\n'"$vt_line""$md_line""- **Code analysis:** GitHub [CodeQL](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml) checks the Python and TypeScript code on every change."
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$notes" "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.scan.outputs.result }}
          FOUND: ${{ needs.scan.outputs.found }}
          VT_RESULT: ${{ needs.virustotal.outputs.result }}
          VT_DETECTIONS: ${{ needs.virustotal.outputs.detections }}
          VT_URL: ${{ needs.virustotal.outputs.url }}
          MD_RESULT: ${{ needs.metadefender.outputs.result }}
          MD_DETECTIONS: ${{ needs.metadefender.outputs.detections }}
          MD_URL: ${{ needs.metadefender.outputs.url }}
      # shields.io endpoint JSON for the README's and the website's VirusTotal and
      # MetaDefender badges, on the orphan `badges` branch. Stable releases only, like the
      # Release badge next to them; a scan that was skipped or failed keeps the old badge.
      - name: Update the scan badges
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        run: |
          badge() { # file label result detections
            local color message
            case "$3" in
              clean) color=brightgreen; message="no threats ($4, ${GITHUB_REF_NAME})" ;;
              flagged) color=orange; message="$4 flagged (${GITHUB_REF_NAME})" ;;
              pending) color=lightgrey; message="pending (${GITHUB_REF_NAME})" ;;
              *) return 0 ;;
            esac
            jq -nc --arg label "$2" --arg message "$message" --arg color "$color" '{schemaVersion: 1, label: $label, message: $message, color: $color}' > "$1"
          }
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch badges "$remote" badges; then cd badges
          else mkdir badges && cd badges && git init -q -b badges; fi
          badge virustotal.json VirusTotal "$VT_RESULT" "$VT_DETECTIONS"
          badge metadefender.json MetaDefender "$MD_RESULT" "$MD_DETECTIONS"
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Scan badges for ${GITHUB_REF_NAME}"
          git push -q "$remote" HEAD:badges
        env:
          GH_TOKEN: ${{ github.token }}
          VT_RESULT: ${{ needs.virustotal.outputs.result }}
          VT_DETECTIONS: ${{ needs.virustotal.outputs.detections }}
          MD_RESULT: ${{ needs.metadefender.outputs.result }}
          MD_DETECTIONS: ${{ needs.metadefender.outputs.detections }}
