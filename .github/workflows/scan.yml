# Scans one release file with ClamAV, VirusTotal and MetaDefender. Called by release.yml
# once for the plugin ZIP and once for the Desktop installer. None of it stops a release:
# each result (clean, flagged, skipped or couldn't scan) goes into the release notes.
name: Scan a release file

on:
  workflow_call:
    inputs:
      # Space-separated, scanned by ClamAV.
      clamav-files: {type: string, required: true}
      # The one file hashed and uploaded to VirusTotal and MetaDefender.
      file: {type: string, required: true}
      # Not named DeckyHub-*: the self-update and the registry's asset filter look for that.
      report: {type: string, required: true}
      artifact: {type: string, required: true}
      # "release ZIP" / "Desktop installer", for messages.
      what: {type: string, required: true}
      # Offsets this upload from the other file's, keeping the free VirusTotal API under its rate limit.
      vt-delay: {type: number, default: 0}
      vt-interval: {type: number, default: 30}
      vt-polls: {type: number, default: 30}
    outputs:
      result: {value: "${{ jobs.scan.outputs.result }}"}
      found: {value: "${{ jobs.scan.outputs.found }}"}
      vt-result: {value: "${{ jobs.virustotal.outputs.result }}"}
      vt-detections: {value: "${{ jobs.virustotal.outputs.detections }}"}
      vt-url: {value: "${{ jobs.virustotal.outputs.url }}"}
      md-result: {value: "${{ jobs.metadefender.outputs.result }}"}
      md-detections: {value: "${{ jobs.metadefender.outputs.detections }}"}
      md-url: {value: "${{ jobs.metadefender.outputs.url }}"}

permissions:
  contents: read

jobs:
  # Scans the file with ClamAV and that day's signatures. Never stops the release:
  # the result (clean, flagged or couldn't scan) goes into the report attached to it and
  # into its notes, and people decide whether to install. The code itself is checked by
  # CodeQL (codeql.yml) on every push and PR.
  scan:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scan.outputs.result }}
      found: ${{ steps.scan.outputs.found }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Install ClamAV and today's signatures
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq clamav
          # The package starts its own updater; stop it so ours doesn't wait on its lock.
          sudo systemctl stop clamav-freshclam || true
          for wait in 0 30 120; do
            sleep "$wait"
            sudo freshclam --stdout && exit 0
          done
          exit 1
      - name: Scan the file
        id: scan
        env:
          INSTALLED: ${{ steps.install.outcome }}
          FILES: ${{ inputs.clamav-files }}
          FILE: ${{ inputs.file }}
          REPORT: ${{ inputs.report }}
          WHAT: ${{ inputs.what }}
        run: |
          zip="$FILE"
          report="$REPORT"
          status=0
          if [[ "$INSTALLED" == success ]]; then
            clamscan --stdout --max-filesize=2048M --max-scansize=4095M --alert-exceeds-max=yes $FILES > scan.log 2>&1 || status=$?
          else
            echo "ClamAV couldn't be installed or couldn't download its virus signatures, so the $WHAT wasn't scanned." > scan.log
            status=2
          fi
          case "$status" in
            0) result=clean ;;
            1) result=infected ;;
            *) result=error ;;
          esac
          found=$(grep -oE ': .+ FOUND$' scan.log | sed -E 's/^: (.+) FOUND$/\1/' | sort -u | paste -sd, - || true)
          {
            echo "ClamAV scan of $zip"
            echo "Result: $result${found:+ ($found)}"
            echo "SHA-256: $(sha256sum "$zip" | cut -d' ' -f1)"
            echo "Scanner: $(clamscan --version 2>/dev/null || echo 'not available')"
            echo "Scanned: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            cat scan.log
          } > "$report"
          cat "$report"
          { echo "result=$result"; echo "found=$found"; } >> "$GITHUB_OUTPUT"
          [[ "$result" == clean ]] || echo "::warning::ClamAV result for $zip: $result${found:+ ($found)}. The release is still published; its notes and report say so."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.report }}
          if-no-files-found: error

  # Uploads DeckyHub's own release ZIP to VirusTotal (70+ antivirus engines) and waits for
  # the verdict. Only DeckyHub's ZIP: listed plugins are only looked up by SHA-256 in the
  # app, never uploaded. Like the ClamAV scan it never stops the release, and it's skipped
  # when the VIRUSTOTAL_API_KEY secret isn't set. Free-tier uploads are public on
  # VirusTotal, which is fine: the same ZIP is published on GitHub minutes later.
  virustotal:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.vt.outputs.result }}
      detections: ${{ steps.vt.outputs.detections }}
      url: ${{ steps.vt.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Scan the file on VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          FILE: ${{ inputs.file }}
          WHAT: ${{ inputs.what }}
          DELAY: ${{ inputs.vt-delay }}
          INTERVAL: ${{ inputs.vt-interval }}
          POLLS: ${{ inputs.vt-polls }}
        run: |
          zip="$FILE"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          url="https://www.virustotal.com/gui/file/${sha}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [[ -z "$VT_API_KEY" ]]; then
            echo "::notice::VIRUSTOTAL_API_KEY isn't set, so the $WHAT wasn't uploaded to VirusTotal."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=error
          detections=""
          # The free API allows 4 requests a minute: the ZIP polls every 30 s, the installer every 60 s.
          sleep "$DELAY"
          if analysis=$(curl -sSf --retry 3 -H "x-apikey: $VT_API_KEY" -F "file=@$zip" https://www.virustotal.com/api/v3/files | jq -er '.data.id'); then
            result=pending
            for _ in $(seq "$POLLS"); do
              sleep "$INTERVAL"
              body=$(curl -sSf --retry 3 -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/${analysis}") || continue
              [[ "$(jq -r '.data.attributes.status' <<< "$body")" == completed ]] || continue
              malicious=$(jq '.data.attributes.stats.malicious' <<< "$body")
              suspicious=$(jq '.data.attributes.stats.suspicious' <<< "$body")
              # Engines that gave a verdict; unsupported/timed-out/failed ones don't count.
              total=$(jq '.data.attributes.stats | .malicious + .suspicious + .undetected + .harmless' <<< "$body")
              detections="$((malicious + suspicious))/$total"
              if (( malicious + suspicious == 0 )); then result=clean; else result=flagged; fi
              jq '.data.attributes.stats' <<< "$body"
              jq -r '.data.attributes.results[] | select(.category == "malicious" or .category == "suspicious") | "\(.engine_name): \(.result)"' <<< "$body"
              break
            done
          else
            echo "::warning::Couldn't upload the $WHAT to VirusTotal (bad API key, quota used up or service down)."
          fi
          echo "VirusTotal: $result${detections:+ ($detections engines flagged it)} $url"
          { echo "result=$result"; echo "detections=$detections"; } >> "$GITHUB_OUTPUT"
          echo "**VirusTotal:** $result${detections:+ ($detections)} — [report]($url)" >> "$GITHUB_STEP_SUMMARY"
          [[ "$result" == clean ]] || echo "::warning::VirusTotal result for $zip: $result${detections:+ ($detections)}. The release is still published; its notes say so."

  # Same idea with OPSWAT MetaDefender Cloud (20+ engines), again only for DeckyHub's own
  # ZIP: never stops the release, skipped when the METADEFENDER_API_KEY secret isn't set.
  metadefender:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.md.outputs.result }}
      detections: ${{ steps.md.outputs.detections }}
      url: ${{ steps.md.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
      - name: Scan the file on MetaDefender
        id: md
        env:
          MD_API_KEY: ${{ secrets.METADEFENDER_API_KEY }}
          FILE: ${{ inputs.file }}
          WHAT: ${{ inputs.what }}
        run: |
          zip="$FILE"
          if [[ -z "$MD_API_KEY" ]]; then
            echo "::notice::METADEFENDER_API_KEY isn't set, so the $WHAT wasn't uploaded to MetaDefender."
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=error
          detections=""
          url=""
          if data_id=$(curl -sSf --retry 3 -X POST -H "apikey: $MD_API_KEY" -H "filename: $zip" -H "Content-Type: application/octet-stream" --data-binary "@$zip" https://api.metadefender.com/v4/file | jq -er '.data_id'); then
            url="https://metadefender.opswat.com/results/file/${data_id}/regular/overview"
            result=pending
            # Poll every 20 s, for up to 15 minutes.
            for _ in $(seq 45); do
              sleep 20
              body=$(curl -sSf --retry 3 -H "apikey: $MD_API_KEY" "https://api.metadefender.com/v4/file/${data_id}") || continue
              [[ "$(jq -r '.scan_results.progress_percentage // 0' <<< "$body")" == 100 ]] || continue
              detected=$(jq '.scan_results.total_detected_avs // 0' <<< "$body")
              total=$(jq '.scan_results.total_avs // 0' <<< "$body")
              detections="$detected/$total"
              code=$(jq '.scan_results.scan_all_result_i // -1' <<< "$body")
              if (( detected > 0 )); then result=flagged; elif (( code == 0 && total > 0 )); then result=clean; else result=error; fi
              jq -r '"Verdict: \(.scan_results.scan_all_result_a)"' <<< "$body"
              jq -r '.scan_results.scan_details | to_entries[] | select((.value.threat_found // "") != "") | "\(.key): \(.value.threat_found)"' <<< "$body"
              break
            done
          else
            echo "::warning::Couldn't upload the $WHAT to MetaDefender (bad API key, quota used up or service down)."
          fi
          echo "MetaDefender: $result${detections:+ ($detections engines flagged it)} $url"
          { echo "result=$result"; echo "detections=$detections"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "**MetaDefender:** $result${detections:+ ($detections)}${url:+ — [report]($url)}" >> "$GITHUB_STEP_SUMMARY"
          [[ "$result" == clean ]] || echo "::warning::MetaDefender result for $zip: $result${detections:+ ($detections)}. The release is still published; its notes say so."
