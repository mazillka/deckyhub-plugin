<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DeckyHub dev mock</title>
    <style>
      :root { --deck-scale: .9; }
      /* Steam Deck's screen is 1280x800 (16:10), ~215 PPI over a 7" panel — much
         denser than a typical ~96 PPI desktop monitor. app.html loads inside a
         real 1280x800 iframe (so 100vh there correctly equals 800px, matching
         the real device — a plain zoomed div would compute 100vh against this
         outer page's real, much-taller window instead). The iframe is then
         visually scaled with a CSS transform, which doesn't affect the vh math
         happening inside it. True 1:1 physical density is ~96/215 ≈ 0.45, but
         that reads too small to inspect comfortably on a monitor, so this uses
         0.9 (0.45 × 2) — confirmed against a real-device photo viewed at 200%
         browser zoom as the size that actually looks right for comparison. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #0a0b0d;
        font-family: sans-serif;
      }
      #deck-frame {
        width: calc(1280px * var(--deck-scale));
        height: calc(800px * var(--deck-scale));
        overflow: hidden;
        border: 2px solid #3d4450;
        border-radius: 8px;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
      }
      #deck-frame iframe {
        width: 1280px;
        height: 800px;
        border: 0;
        transform: scale(var(--deck-scale));
        transform-origin: top left;
      }
      #deck-frame-label {
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="deck-frame"><iframe id="deck-app" src="/app.html" title="DeckyHub dev mock"></iframe></div>
    <div id="deck-frame-label">1280×800 @ 215 PPI · auto-fit enabled</div>
    <script>
      document.querySelector("#deck-app").src += window.location.search;
      const fit = () => {
        const scale = Math.max(0.1, Math.min(0.9, (innerWidth - 32) / 1280, (innerHeight - 48) / 800));
        document.documentElement.style.setProperty("--deck-scale", scale);
        document.querySelector("#deck-frame-label").textContent = `1280×800 @ 215 PPI · auto-fit ${Math.round(scale * 100)}%`;
      };
      addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
