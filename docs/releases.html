<link rel="canonical" href="https://deckyhub.com/releases.html">
<link rel="alternate" type="application/atom+xml" title="DeckyHub releases" href="https://github.com/mazillka/deckyhub-plugin/releases.atom">

<meta property="og:type" content="website">
<meta property="og:site_name" content="DeckyHub">

<style>
:root{color-scheme:dark;--bg:#10151f;--panel:#182131;--line:#2e405a;--text:#eef4ff;--muted:#b6c3d4;--dim:#8a9bb2;--accent:#1d75cc;--accent2:#4b9cf0;--warn:#e8b54a}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent2)}
.wrap{max-width:860px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:rgba(16,21,31,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:20px;height:56px;max-width:1100px}
nav .brand{font-weight:700;color:var(--text);text-decoration:none;margin-right:auto}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem}nav a:hover{color:var(--text)}
header{padding:56px 0 24px}
h1{font-size:clamp(2rem,5vw,2.8rem);line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
.release{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin:0 0 18px;scroll-margin-top:72px}
.release h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:0 0 4px;font-size:1.45rem}
.release h2 a{color:var(--text);text-decoration:none}.release h2 a:hover{color:var(--accent2)}
.release time{color:var(--dim);font-size:.9rem;font-weight:400}
.pre{font-size:.75rem;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.release h3{font-size:1.05rem;margin:18px 0 6px}
.release p,.release li{color:var(--muted)}.release strong{color:var(--text)}
.release ul{padding-left:22px;margin:6px 0}
.release .links{margin:14px 0 0;font-size:.9rem}
code{background:#0f1724;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.88em;overflow-wrap:anywhere}
footer{padding:36px 0;border-top:1px solid var(--line);color:var(--dim);font-size:.88rem;margin-top:36px}
@media(max-width:640px){.release{padding:18px}nav .hide{display:none}}

/* site-nav-style */
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<!-- site-nav: releases -->
<main id="main"><div class="wrap">
<header>
<h1>DeckyHub release notes</h1>
<p class="sub">What's new in each version of DeckyHub, newest first. DeckyHub updates itself from its Quick Access tab; pre-releases are offered on the Pre-release channel.</p>
</header>
<!-- releases -->
</div></main>
<!-- site-footer -->
</body>
</html>
