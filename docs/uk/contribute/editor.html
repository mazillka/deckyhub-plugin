<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор реєстру DeckyHub</title>
<meta name="description" content="Редактор реєстрів DeckyHub у браузері: додавайте проєкти GitHub, перевіряйте й експортуйте файл реєстру, щоб розмістити його й додати в DeckyHub як власний реєстр.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://deckyhub.com/uk/contribute/editor.html">
<link rel="alternate" hreflang="en" href="https://deckyhub.com/contribute/editor.html">
<link rel="alternate" hreflang="uk" href="https://deckyhub.com/uk/contribute/editor.html">
<link rel="alternate" hreflang="x-default" href="https://deckyhub.com/contribute/editor.html">
<meta name="theme-color" content="#10151f">
<meta property="og:type" content="website"><meta property="og:site_name" content="DeckyHub">
<meta property="og:url" content="https://deckyhub.com/uk/contribute/editor.html"><meta property="og:title" content="Редактор реєстру DeckyHub">
<meta property="og:description" content="Додавайте проєкти GitHub, перевіряйте їх і експортуйте файл реєстру для DeckyHub просто в браузері.">
<meta property="og:image" content="https://deckyhub.com/img/og.jpg"><meta name="twitter:card" content="summary_large_image">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151f;color:#eef4ff}body{max-width:1040px;margin:auto;padding:24px}p{color:#b6c3d4}button,input,select,textarea{font:inherit;border:1px solid #40516a;border-radius:6px}button{background:#1d75cc;color:#fff;padding:9px 12px;cursor:pointer}button.secondary{background:#26364c}button.danger{background:#a93a45}button:disabled{opacity:.5}.toolbar,.tabs,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tabs .active{background:#4b9cf0}.panel{background:#182131;border:1px solid #2e405a;border-radius:10px;padding:18px}.hidden{display:none}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}label{display:grid;gap:6px;color:#cbd8e9;font-size:.9rem}input,select,textarea{padding:9px;background:#0f1724;color:#eef4ff}textarea{box-sizing:border-box;width:100%;min-height:390px;resize:vertical;font-family:ui-monospace,monospace;font-size:.85rem}.hint{font-size:.82rem;color:#9eb0c6}.status{min-height:1.4em;margin:12px 0;color:#9ed3aa}.error{color:#ff9ba4;white-space:pre-wrap}.repo-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px;margin-top:18px}.repo{text-align:left;background:#202c40;border:1px solid #3a4b66;padding:12px}.repo.selected{border-color:#64b0f5;background:#263b58}.repo strong,.repo small{display:block}.repo small{color:#adc0d7;margin-top:4px;overflow-wrap:anywhere}

/* site-nav-style */
body{max-width:none;padding:0}.editor-content{max-width:1040px;margin:auto;padding:24px}
</style>
</head>
<body>
<a class="skip" href="#main">Перейти до вмісту</a>
<!-- site-nav: contribute -->
<main id="main" class="editor-content">
<h1>Редактор реєстру DeckyHub</h1>
<p>Ведіть переносний список проєктів GitHub для DeckyHub. Зміни лишаються в цьому браузері, доки ви не експортуєте JSON.</p>
<div class="toolbar"><button id="reload" class="secondary">Завантажити типові репозиторії</button><button id="export">Експортувати JSON</button><label class="secondary" style="display:inline-flex;align-items:center;padding:9px 12px;cursor:pointer">Імпортувати JSON<input id="import" type="file" accept="application/json,.json" hidden></label></div>
<div class="tabs"><button class="active" data-tab="form">Редактор репозиторіїв</button><button class="secondary" data-tab="raw">Сирий JSON</button></div>
<div id="status" class="status" role="status"></div>
<section id="form-panel" class="panel">
<div class="actions"><button id="new-repo">Додати репозиторій</button><button id="cancel-new" class="secondary" disabled>Скасувати</button><button id="save-repo" class="secondary">Зберегти репозиторій</button><button id="remove-repo" class="danger">Видалити репозиторій</button></div>
<div class="form-grid">
<label>ID репозиторію<input id="id" placeholder="my-tool"><span class="hint">Малі літери, цифри та дефіси.</span></label>
<label>Показана назва<input id="name" placeholder="My Tool"></label>
<label>Репозиторій GitHub<input id="repo" placeholder="owner/repository"><span class="hint">Не вставляйте повну адресу GitHub.</span></label>
<label>Категорія<input id="category" placeholder="Utilities"></label>
<label>Включити файли<input id="include" placeholder="decky, linux, x86_64"><span class="hint">Через кому; порожнє дозволяє всі.</span></label>
<label>Виключити файли<input id="exclude" placeholder="source, arm"><span class="hint">Слова через кому, які треба пропускати.</span></label>
</div>
<h2>Репозиторії</h2><div id="repo-list" class="repo-list"></div>
</section>
<section id="raw-panel" class="panel hidden"><p class="hint">Для розширених полів. «Застосувати» перевіряє весь JSON, перш ніж замінити поточний список.</p><textarea id="editor" spellcheck="false" aria-label="Сирий JSON реєстру"></textarea><div class="actions"><button id="apply-raw">Перевірити й застосувати JSON</button></div></section>
</main>
<!-- site-footer -->
<script>
const $=id=>document.getElementById(id),editor=$("editor");let registry={schemaVersion:1,apps:[]},selectedId=null,previousId=null,adding=false;
function status(message,error){const n=$("status");n.textContent=message;n.className="status"+(error?" error":"")}
function terms(value){return value.split(",").map(v=>v.trim()).filter(Boolean)}
function validate(value){const e=[];if(!value||typeof value!=="object"||Array.isArray(value))e.push("Реєстр має бути об'єктом.");if(value&&value.schemaVersion!==1)e.push("schemaVersion має дорівнювати 1.");if(!value||!Array.isArray(value.apps))e.push("apps має бути масивом.");if(e.length)return e;const ids=new Set(),repos=new Set();value.apps.forEach((a,i)=>{const p="Застосунок "+(i+1);if(!a||typeof a!=="object"||Array.isArray(a)){e.push(p+" має бути об'єктом.");return}["id","name","repo","category","asset"].forEach(k=>{if(!(k in a))e.push(p+": бракує "+k+".")});if(typeof a.id!=="string"||!/^[a-z0-9][a-z0-9-]*$/.test(a.id))e.push(p+": id має складатися з малих літер, цифр і дефісів.");if(typeof a.name!=="string"||!a.name.trim())e.push(p+": потрібна назва (name).");if(typeof a.repo!=="string"||!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(a.repo))e.push(p+": repo має мати вигляд owner/repository.");if(typeof a.category!=="string"||!a.category.trim())e.push(p+": потрібна категорія (category).");if(!a.asset||typeof a.asset!=="object"||Array.isArray(a.asset))e.push(p+": asset має бути об'єктом.");else ["include","exclude"].forEach(k=>{if(!Array.isArray(a.asset[k])||a.asset[k].some(x=>typeof x!=="string"||!x.trim()))e.push(p+": asset."+k+" має бути масивом непорожніх рядків.")});if(ids.has(a.id))e.push(p+": id '"+a.id+"' повторюється.");ids.add(a.id);if(repos.has(a.repo))e.push(p+": repo '"+a.repo+"' повторюється.");repos.add(a.repo)});return e}
function current(){return registry.apps.find(a=>a.id===selectedId)}function sync(){editor.value=JSON.stringify(registry,null,2)}
function populate(a){selectedId=a?a.id:null;["id","name","repo","category"].forEach(k=>$(k).value=a&&a[k]?a[k]:"");$("include").value=a&&a.asset?a.asset.include.join(", "):"";$("exclude").value=a&&a.asset?a.asset.exclude.join(", "):"";$("remove-repo").disabled=!a}
function render(){const list=$("repo-list");list.replaceChildren();registry.apps.forEach(a=>{const b=document.createElement("button");b.className="repo"+(a.id===selectedId?" selected":"");const strong=document.createElement("strong"),small=document.createElement("small");strong.textContent=a.name;small.textContent=a.repo+" · "+a.category;b.append(strong,small);b.onclick=()=>{populate(a);render()};list.append(b)})}
function setRegistry(next,message){const errors=validate(next);if(errors.length){status(errors.join("\\n"),true);return false}registry=next;selectedId=registry.apps.some(a=>a.id===selectedId)?selectedId:(registry.apps[0]?registry.apps[0].id:null);sync();populate(current());render();status(message||"Реєстр дійсний.");return true}
function formValue(){const old=current()||{};return Object.assign({},old,{id:$("id").value.trim(),name:$("name").value.trim(),repo:$("repo").value.trim(),category:$("category").value.trim(),asset:{include:terms($("include").value),exclude:terms($("exclude").value),}})}
function save(){const app=formValue(),apps=registry.apps.slice(),i=apps.findIndex(a=>a.id===selectedId);if(i<0)apps.push(app);else apps[i]=app;if(setRegistry(Object.assign({},registry,{apps}),"Збережено "+(app.name||"репозиторій")+".")){adding=false;$("cancel-new").disabled=true;selectedId=app.id;populate(current());render()}}
function tab(name){$("form-panel").classList.toggle("hidden",name!=="form");$("raw-panel").classList.toggle("hidden",name!=="raw");document.querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("active",b.dataset.tab===name);b.classList.toggle("secondary",b.dataset.tab!==name)})}
async function load(){try{const r=await fetch("https://raw.githubusercontent.com/mazillka/deckyhub-registry/refs/heads/main/registry/apps.json",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);setRegistry(await r.json(),"Типові репозиторії завантажено.")}catch(err){status("Не вдалося завантажити типовий реєстр: "+err.message,true)}}
$("new-repo").onclick=()=>{previousId=selectedId;adding=true;$("cancel-new").disabled=false;selectedId=null;populate();render();$("name").focus()};$("cancel-new").onclick=()=>{if(!adding)return;adding=false;$("cancel-new").disabled=true;selectedId=previousId;populate(current());render();status("Новий репозиторій відкинуто.")};$("save-repo").onclick=save;$("remove-repo").onclick=()=>{const a=current();if(!a)return;registry=Object.assign({},registry,{apps:registry.apps.filter(x=>x.id!==a.id)});selectedId=registry.apps[0]?registry.apps[0].id:null;sync();populate(current());render();status("Видалено "+a.name+".")};$("apply-raw").onclick=()=>{try{setRegistry(JSON.parse(editor.value),"Сирий JSON дійсний і застосований.")}catch(err){status("Недійсний JSON: "+err.message,true)}};$("reload").onclick=load;$("export").onclick=()=>{const errors=validate(registry);if(errors.length)return status(errors.join("\\n"),true);const blob=new Blob([JSON.stringify(registry,null,2)+"\n"],{type:"application/json"}),link=document.createElement("a"),url=URL.createObjectURL(blob);link.href=url;link.download="deckyhub-apps.json";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),0);status("Реєстр експортовано.")};$("import").onchange=async event=>{const file=event.target.files[0];if(!file)return;try{setRegistry(JSON.parse(await file.text()),"Імпортовано "+file.name+".")}catch(err){status("Не вдалося імпортувати: "+err.message,true)}event.target.value=""};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>tab(b.dataset.tab));load();
</script>
</body></html>
